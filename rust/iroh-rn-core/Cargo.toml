# The staticlib must be named `libIroh_rust.a`: that exact file name is what
# the nitrogen-generated `Iroh+autolinking.cmake` links against.
[package]
name = "iroh-rn-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
# MSRV inherited from iroh 1.0.3 / iroh-blobs 0.103.0 (both require 1.91).
rust-version = "1.91"
publish = false

[lib]
name = "Iroh_rust"
crate-type = ["staticlib", "rlib"]

# mDNS LAN discovery. Off by default so the default `cargo test` / CI build (and
# every Apple build) compiles the multicast machinery OUT: the JS surface then
# reports `MDNS_SUPPORTED === false` and throws `mdns-unavailable`. Android build
# scripts pass `--features mdns`; iOS never does. Pulls the `jni` crate only when
# both this feature and `target_os = "android"` are active (the MulticastLock).
[features]
default = []
mdns = ["dep:iroh-mdns-address-lookup", "dep:jni"]

[dependencies]
iroh_rust = { path = "../../nitrogen/generated/shared/rust" }
iroh = "=1.0.3"
iroh-blobs = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
# Docs is a meta-protocol layered on the same endpoint over blobs + gossip. Only
# `fs-store` is enabled: it gates `Docs::persistent` and pulls nothing beyond the
# `iroh-blobs/fs-store` we already depend on. `rpc` (a QUIC RPC client transport),
# `metrics`, and `redb-v2-migration` are all unused by the in-process API.
iroh-docs = { version = "=0.101.0", default-features = false, features = ["fs-store"] }
# mDNS (DNS-SD `_irohv1._udp.local`) discovery on the LAN, behind the `mdns`
# Cargo feature. Optional and off by default: Apple builds are compiled WITHOUT
# it (no multicast entitlement yet), and a no-feature build reports the mDNS
# surface unavailable rather than shipping dead multicast code. n0-official,
# binds against iroh 1.0.x.
iroh-mdns-address-lookup = { version = "=0.4.0", optional = true }
n0-future = "=0.3.2"
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
thiserror = "=2.0.18"
tracing = "=0.1.44"
# Gossip payloads cross into iroh-gossip as `bytes::Bytes`; the topic id is the
# BLAKE3 hash of the topic label. Both are shared with the wider iroh stack, so
# they resolve to the versions already in the lock file.
bytes = "1"
blake3 = "1"
# Gossip bootstrap peers cross the bridge as newline-joined EndpointAddr JSON.
# The bridge layer only ever serializes JSON by hand; parsing structured
# addressing input back into an `iroh::EndpointAddr` is confined to the gossip
# core module, where a real JSON parser is the robust, honest choice.
serde_json = "1"
# Routes the iroh stack's own `tracing` output to the platform log. Without a
# subscriber installed, every `tracing` call in iroh, iroh-blobs and
# iroh-gossip is discarded, which leaves a failing transfer diagnosable only
# through the error that reaches JS.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# Android's logging goes through liblog rather than stderr, so it needs a writer
# that speaks it. `ndk-context` is how the iroh stack reaches the Android JNI
# context: `iroh-dns` reads the system resolver through it, and it *panics* if no
# context was installed, so the host has to install one before any DNS lookup.
[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
ndk-context = "0.1"
# Only pulled in when the `mdns` feature is on (see `[features]`): the Rust
# multicast sockets need a held `WifiManager.MulticastLock` while mDNS is active,
# acquired through the installed JNI context (see `android_context`). Non-android
# builds never see this; non-mdns android builds never enable it.
jni = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
